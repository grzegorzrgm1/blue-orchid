name: Swing Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show repository files
        run: |
          pwd
          ls -lb
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type f

      - name: Install dependencies
        run: |
          python -m pip install -r "$GITHUB_WORKSPACE/requirements.txt"

      - name: Run scanner
        run: python "$GITHUB_WORKSPACE/scanner.py"

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update swing scanner data"
            git push
          fi
